<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | Kaler Dairy Farm</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fbf8ef;color:#17251e;font:14px 'DM Sans',sans-serif}.top{background:#123e31;color:white;padding:20px 25px}.wrap{max-width:760px;margin:7vh auto;padding:20px}.panel{background:white;border:1px solid #e5e8de;border-radius:20px;padding:25px}.title{font:700 32px 'Playfair Display',serif}.muted{color:#68766d;font-size:12px;line-height:1.7}input{width:100%;padding:14px;border:1px solid #e5e8de;border-radius:10px;box-sizing:border-box;margin:8px 0 12px}.btn{background:#d5f06b;color:#123e31;border:0;border-radius:10px;padding:14px 18px;font-weight:800;cursor:pointer}.history{border-left:2px solid #d5f06b;margin:20px 0;padding-left:18px}.item{margin:16px 0}.badge{background:#edf2dd;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:700}</style></head><body><header class="top"><b style="font:700 22px 'Playfair Display',serif">✦ Kaler Dairy Farm</b><a href="/" style="float:right;color:#d5f06b">← Back to store</a></header><main class="wrap"><section class="panel"><div class="muted">ORDER STATUS</div><h1 class="title">Track your order</h1><p class="muted">Enter the tracking number or order ID you received after placing your order.</p><form id="form"><input id="tracking" required placeholder="Tracking number / order ID"><button class="btn">Find my order →</button></form><div id="result"></div></section></main><script>const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function track(id){$('#tracking').value=id;$('#result').innerHTML='<p class="muted">Checking order status…</p>';try{const r=await fetch('/api/track/'+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error);const o=d.order;$('#result').innerHTML=`<div style="border-top:1px solid #e5e8de;margin-top:22px;padding-top:18px"><span class="badge">${esc(o.status)}</span><h2 style="font:700 24px 'Playfair Display',serif">Order ${esc(o.id)}</h2><p class="muted">Tracking number: <b>${esc(o.trackingNumber)}</b><br>Payment: <b>${esc(o.paymentStatus)}</b><br>Order total: <b>₹${Number(o.total).toLocaleString('en-IN')}</b><br>Courier: <b>${esc(o.courier?.name||'Not assigned yet')}</b>${o.courier?.trackingUrl?`<br><a target="_blank" rel="noopener" href="${esc(o.courier.trackingUrl)}">Open carrier tracking ↗</a>`:''}</p><h3>Order timeline</h3><div class="history">${o.history.map(h=>`<div class="item"><b>${esc(h.status)}</b><div class="muted">${new Date(h.at).toLocaleString()}</div><div class="muted">${esc(h.note||'')}</div></div>`).join('')}</div><p class="muted">Carrier live scans appear only when the farm assigns a real carrier tracking link and that carrier provides tracking updates.</p></div>`}catch(e){$('#result').innerHTML='<p style="color:#a83e28;margin-top:16px">'+esc(e.message)+'</p>'}}$('#form').addEventListener('submit',e=>{e.preventDefault();track($('#tracking').value.trim())});const params=new URLSearchParams(location.search);if(params.get('id'))track(params.get('id'));</script></body></html>
